# Builds the Windows installer on every push to the build branch and publishes
# it as a GitHub release. The version comes from pubspec.yaml: bump it before
# releasing, since a version that already has a release fails the build. The
# release text is that version's section of CHANGELOG.md, which must exist.
#   git switch build
#   git merge main
#   git push
name: Release

on:
  push:
    branches: [build]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, to tell whether this version is out already.
          fetch-depth: 0

      - name: Read the version from pubspec.yaml
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released, bump the version in pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The "## <version>" section of CHANGELOG.md becomes the release text.
      - name: Take the release notes from CHANGELOG.md
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v heading="## $version" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section \"## $version\""
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Nothing goes out that fails them.
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the app
        run: flutter build windows --release

      - name: Build the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\noodlet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Creates the tag on the pushed commit along with the release.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NoodleT ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/NoodleT-Setup-*.exe
          body_path: release-notes.md
