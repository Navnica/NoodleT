# Builds NoodleT on every push to the build branch and publishes it as a
# GitHub release: the Windows installer and a Linux archive. The version comes
# from pubspec.yaml: bump it before releasing, since a version that already
# has a release fails the build. The release text is that version's section
# of CHANGELOG.md, which must exist.
#   git switch build
#   git merge main
#   git push
#
# The two platforms build side by side; the release is made once both are
# done, so that it never goes out with only one of them.
name: Release

on:
  push:
    branches: [build]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, to tell whether this version is out already.
          fetch-depth: 0

      - name: Read the version from pubspec.yaml
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released, bump the version in pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The "## <version>" section of CHANGELOG.md becomes the release text.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v heading="## $version" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section \"## $version\""
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Nothing goes out that fails them.
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --exclude-tags proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the app
        run: flutter build windows --release

      - name: Build the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.prepare.outputs.version }}" installer\noodlet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/NoodleT-Setup-*.exe
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What flutter build linux needs from the system.
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test --exclude-tags proxy

      - name: Build the app
        run: flutter build linux --release

      # The bundle runs from wherever it is unpacked: the noodlet binary with
      # its lib and data folders next to it.
      - name: Pack the archive
        run: |
          name="NoodleT-${{ needs.prepare.outputs.version }}-linux-x64"
          mkdir -p dist
          cp -r build/linux/x64/release/bundle "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/NoodleT-*-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Creates the tag on the pushed commit along with the release.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: NoodleT ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/NoodleT-Setup-*.exe
            dist/NoodleT-*-linux-x64.tar.gz
          body_path: dist/release-notes.md
