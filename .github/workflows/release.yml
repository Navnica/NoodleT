# Builds the Windows installer on every push to the build branch and publishes
# it as a GitHub release. The release and its tag are named after the short
# hash of the pushed commit, e.g. 7fa625d:
#   git switch build
#   git merge main
#   git push
name: Release

on:
  push:
    branches: [build]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Name the build after the commit
        id: version
        shell: bash
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The version inside noodlet.exe stays the one in pubspec.yaml: Windows
      # only accepts numbers there, not a commit hash.
      - name: Build the app
        run: flutter build windows --release

      - name: Build the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\noodlet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Creates the tag on the pushed commit along with the release.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/NoodleT-Setup-*.exe
          generate_release_notes: true
