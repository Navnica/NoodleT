# Builds the Windows installer on every push to the build branch and publishes
# it as a GitHub release. The version comes from pubspec.yaml: bump it before
# releasing, since a version that already has a release fails the build.
#   git switch build
#   git merge main
#   git push
name: Release

on:
  push:
    branches: [build]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, to tell whether this version is out already.
          fetch-depth: 0

      - name: Read the version from pubspec.yaml
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released, bump the version in pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build the app
        run: flutter build windows --release

      - name: Build the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\noodlet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Creates the tag on the pushed commit along with the release.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NoodleT ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/NoodleT-Setup-*.exe
          generate_release_notes: true
