# Checks every push and pull request: formatting, the analyzer and the tests,
# on Windows and on Linux, the platforms NoodleT is released for. The engine
# tests drive the real libtorrent build that libtorrent_dart ships for each.
# Linux also builds the app, which compiles its runner and the plugins.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # What flutter build linux needs from the system.
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyzer
        run: flutter analyze

      # The proxy tests stay on the developer's machine.
      - name: Tests
        run: flutter test --exclude-tags proxy

      - name: Linux build
        if: runner.os == 'Linux'
        run: flutter build linux --release
