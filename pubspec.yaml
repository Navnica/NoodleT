name: noodlet
description: "NoodleT - a simple desktop torrent client"
publish_to: 'none'

# The installer and the release take the version from here; lib/version.dart
# repeats it for the code (test/version_test.dart keeps the two equal).
version: 1.5.1+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  # Pinned: each version ships its own libtorrent build, and lib/engine relies
  # on the settings identifiers of libtorrent 2.0.
  libtorrent_dart: 1.2.0
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  socks5_proxy: ^2.1.2
  # The size of the screen, for the window's first size; window_manager
  # uses it too.
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # Generates lib/l10n/app_localizations*.dart from the .arb files.
  generate: true
  uses-material-design: true

  # The tray icon, a 64 px copy of assets/icon/icon.png (see lib/tray.dart).
  assets:
    - assets/icon/tray.png
